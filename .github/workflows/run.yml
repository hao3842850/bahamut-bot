name: Bahamut Korean NEW Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run bot
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python bot.py

      - name: Save seen_ids
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add seen_ids.json || true
          git diff --cached --quiet || git commit -m "update seen_ids"
          git push || true